<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Diamond Mountain</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="top">
		<p> 山の頂上に太陽が昇る/沈む日を探索します </p>
		<div id="controls">
			<div class="input-row">
				<label>対象の山
					<select id="mountain">
						<option value=""> --- 山の選択／登録 --- </option>
					</select>
				</label>
				<button id="run">可視範囲</button>
			</div>

			<!-- <div style="display: flex; gap: 8px; grid-column: span 2;"> -->
			<div class="input-row">
				<label style="flex: 2;">観測開始日
					<input type="date" id="startDate">
				</label>
				<label style="flex: 1;">探索期間
					<select id="years">
						<option value="1">1年</option>
						<option value="2" selected>2年</option>
						<option value="3">3年</option>
						<option value="5">5年</option>
					</select>
				</label>
			</div>

			<button class="green-btn" id="period">ダイヤモンド発生日を表示</button>

			<!-- <div style="display: flex; gap: 8px; grid-column: span 2;"> -->
			<div class="input-row">
				<label>高度(m) <input id="obsElev" type="number" value="0"></label>
				<label>方位許容(°) <input id="azTol" type="number" value="0.5" step="0.1"></label>
				<label>仰角許容(°) <input id="elTol" type="number" value="0.5" step="0.1"></label>
			</div>

			<button class="clear-btn" id="clear">クリア</button>
		</div>
		<div class="message-area" id="info">地図をクリックするとその地点の可視判定・山方向・山頂仰角を表示します。<br><b>最初に山を選択するか登録してください。</b></div>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JavaScript (読み込み順序厳守) -->
    <script src="js/constants.js"></script>              <!-- 1. 定数を最初に -->
    <script src="js/utils.js"></script>                  <!-- 2. ユーティリティ関数 -->
    <script src="js/config.js"></script>                 <!-- 3. 山のデータと初期化関数 -->
    <script src="js/astronomy.js"></script>              <!-- 4. 天文計算関数 -->
    <script src="js/elevation.js"></script>              <!-- 5. 標高取得 -->
    <script src="js/visibility-boundaries.js"></script>  <!-- 6. 可視範囲境界線(軽量版) -->
    <script src="js/sun-direction.js"></script>          <!-- 7. 日の出・日の入り線描画 -->
    <script src="js/periods.js"></script>                <!-- 8. 期間検索機能 -->
    <script src="js/main.js"></script>                   <!-- 9. メインロジック(最後!) -->
</body>

</html>
