<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ダイヤモンドマウンテン可視領域マップ</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body,#map{ height:100%; margin:0; padding:0 }
  body{ display:flex; flex-direction:column; font-family:system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif }
  #top { padding:10px; background:#f3f3f3; box-shadow:0 1px 2px rgba(0,0,0,.08); z-index:1000 }
  #controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  input, button, select { padding:6px 8px; font-size:14px }
  #map { flex:1 }
  #info { padding:8px; max-height:220px; overflow:auto; font-size:13px }
  .legend { background:white; padding:6px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.12) }

  .leaflet-container {
	  /* マップ上のカーソル形状 */
	  /* cursor: default !important; */
	  cursor: crosshair !important;
  }

  /* ポップアップを広く・自動改行・見やすく */
  .leaflet-popup-content-wrapper {
    padding: 10px 14px !important;
    border-radius: 8px !important;
    box-shadow: 0 3px 14px rgba(0,0,0,0.3) !important;
  }
  .leaflet-popup-content {
    margin: 0 !important;
    max-width: 380px !important;
    width: auto !important;
    white-space: normal !important;
    font-size: 13.5px !important;
    line-height: 1.5 !important;
  }
  .leaflet-popup-tip {
    box-shadow: 0 3px 14px rgba(0,0,0,0.3) !important;
  }
</style>
</head>
<body>
<div id="top">
  <div id="controls">
    <label>観測開始年: <input id="startYear" type="number" value="2025" style="width:100px"></label>
    <label>探索年数: <input id="years" type="number" value="5" style="width:80px"></label>
    <label>中心マウンテン: 
		<select id="mountain">
			<option value="" disabled selected>－－ 山を選択 －－</option>
			<option value="chokai">鳥海山（七高山）</option>
			<option value="fuji">富士山（剣ヶ峰）</option>
			<!-- 山を追加する場合は、ここに追加する -->
		</select>
	</label>
    <label>観測高度(m): <input id="obsElev" type="number" value="80" style="width:80px"></label>
    <label>方位許容(°): <input id="azTol" type="number" value="0.5" step="0.1" style="width:70px"></label>
    <label>仰角許容(°): <input id="elTol" type="number" value="0.5" step="0.1" style="width:70px"></label>
    <button id="run">可視領域計算</button>
    <button id="clear">クリア</button>
  </div>
  <div id="info">座標をクリックするとその地点の可視判定・山方向・山頂仰角を表示します。</div>
</div>
<div id="map"></div>

<!-- Leaflet JS (placed before our script). No integrity attribute to avoid CDN integrity mismatch issues -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Ensure code runs after Leaflet has loaded and DOM is ready
window.addEventListener('load', function(){
  if (typeof L === 'undefined'){
    document.getElementById('info').textContent = 'エラー: Leaflet が読み込まれていません。ネットワーク接続を確認するか、script タグを修正してください。';
    return;
  }

  // ===== Configuration =====
  const JST = 9; // fixed
  const mountains = {
    chokai: { name: '鳥海山 (七高山)', lat: 39.09945869580092, lon: 140.0513154997461, h: 2230 },
    fuji:   { name: '富士山 (剣ヶ峰)', lat: 35.3607237631673, lon: 138.72738839451753, h: 3776 }
  };

  // ===== Leaflet map setup =====
  const map = L.map('map').setView([39.13, 140.27], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(map);

  let visLayer = L.layerGroup().addTo(map);
  let sampleLayer = L.layerGroup().addTo(map);

  // ===== Astronomy helpers (JS translation of earlier functions) =====
  const deg2rad = d => d*Math.PI/180;
  const rad2deg = r => r*180/Math.PI;

  function toJulianDayUTC(dateUtc){
    // dateUtc is JS Date in UTC
    const Y = dateUtc.getUTCFullYear();
    let M = dateUtc.getUTCMonth()+1;
    let D = dateUtc.getUTCDate() + (dateUtc.getUTCHours() + dateUtc.getUTCMinutes()/60 + dateUtc.getUTCSeconds()/3600 + dateUtc.getUTCMilliseconds()/3.6e6)/24;
    let Y2 = Y; let M2 = M;
    if(M2 <= 2){Y2 -= 1; M2 += 12}
    const A = Math.floor(Y2/100);
    const B = 2 - A + Math.floor(A/4);
    const JD = Math.floor(365.25*(Y2+4716)) + Math.floor(30.6001*(M2+1)) + D + B - 1524.5;
    return JD;
  }

  function sunPositionJD(jd){
    const n = jd - 2451545.0;
    let L = (280.460 + 0.9856474 * n) % 360; if(L<0) L+=360;
    const g = (357.528 + 0.9856003 * n) % 360;
    const gRad = deg2rad(g);
    let lam = L + 1.915*Math.sin(gRad) + 0.02*Math.sin(2*gRad);
    lam = (lam%360+360)%360;
    const eps = deg2rad(23.439);
    const lamRad = deg2rad(lam);
    const delta = Math.asin(Math.sin(eps)*Math.sin(lamRad));
    return { lambda: lam, decl: rad2deg(delta) };
  }

  function hourAngleFromLocalClock(localDate, longitude, tzOffsetHours){
    // localDate: JS Date representing local clock time (naive) - we will use its components
    const Hh = localDate.getHours() + localDate.getMinutes()/60 + localDate.getSeconds()/3600;
    const localSolarTime = Hh + (longitude/15.0) - tzOffsetHours;
    return 15*(localSolarTime - 12); // degrees
  }

  function sunAltAzLocal(lat, lon, localDate, tzOffsetHours){
    // compute UTC date equivalent
    const utcMillis = Date.UTC(localDate.getFullYear(), localDate.getMonth(), localDate.getDate(), localDate.getHours() - tzOffsetHours, localDate.getMinutes(), localDate.getSeconds(), localDate.getMilliseconds());
    const dtUtc = new Date(utcMillis);
    const jd = toJulianDayUTC(dtUtc);
    const sp = sunPositionJD(jd);
    const delta = deg2rad(sp.decl);
    const phi = deg2rad(lat);
    const Hdeg = hourAngleFromLocalClock(localDate, lon, tzOffsetHours);
    const H = deg2rad(Hdeg);
    let sin_h = Math.sin(phi)*Math.sin(delta) + Math.cos(phi)*Math.cos(delta)*Math.cos(H);
    sin_h = Math.max(-1, Math.min(1, sin_h));
    const alt = rad2deg(Math.asin(sin_h));
    const y = -Math.sin(H);
    const x = Math.cos(phi)*Math.tan(delta) - Math.sin(phi)*Math.cos(H);
    let az = rad2deg(Math.atan2(y,x)); az = (az + 360) % 360;
    return {alt, az};
  }

  function bearingAndApparentElevation(latObs, lonObs, hObs, latTgt, lonTgt, hTgt){
    const R = 6371000;
    const lat1 = deg2rad(latObs), lat2 = deg2rad(latTgt);
    const dlon = deg2rad(lonTgt - lonObs);
    const y = Math.sin(dlon) * Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dlon);
    const bearing = (rad2deg(Math.atan2(y,x)) + 360) % 360;
    const central = Math.acos(Math.max(-1, Math.min(1, Math.sin(lat1)*Math.sin(lat2) + Math.cos(lat1)*Math.cos(lat2)*Math.cos(dlon))));
    const dist = R * central;
    const dh = hTgt - hObs;
    const elev = rad2deg(Math.atan2(dh, dist));
    return {bearing, elev, dist};
  }

  function angleDiff(a,b){ const d = Math.abs(a-b)%360; return Math.min(d,360-d); }

  // ===== Visibility grid calculation =====
  // We'll scan a bounding box around mountain (radius R_km) and sample points on a grid.
  // For each grid point: compute bearing & apparent elev to mountain.
  // Then check if there exists a time in the search period where sun.az ~= bearing and sun.alt ~= elev

  async function computeVisibility(opts){
    visLayer.clearLayers(); sampleLayer.clearLayers();
    const startYear = parseInt(opts.startYear,10);
    const years = parseInt(opts.years,10);
    const azTol = parseFloat(opts.azTol);
    const elTol = parseFloat(opts.elTol);
    const obsElev = parseFloat(opts.obsElev);
    const mt = mountains[opts.mountKey];

    // bounding box: we consider up to 60 km from mountain (user can change)
    const Rkm = 60;
    const step_km = opts.step_km || 2; // coarse grid step in km

    // compute bbox lat/lon deltas
    const lat_km = 111.32; // approx km per deg lat
    const lon_km_at_lat = 111.32 * Math.cos(deg2rad(mt.lat));
    const dlat = (Rkm / lat_km);
    const dlon = (Rkm / lon_km_at_lat);

    const lat_min = mt.lat - dlat; const lat_max = mt.lat + dlat;
    const lon_min = mt.lon - dlon; const lon_max = mt.lon + dlon;

    // grid resolution in degrees
    const lat_step = step_km / lat_km;
    const lon_step = step_km / lon_km_at_lat;

    const results = [];

    // iterate grid
    for(let lat = lat_min; lat <= lat_max + 1e-12; lat += lat_step){
      for(let lon = lon_min; lon <= lon_max + 1e-12; lon += lon_step){
        // skip points too near mountain (avoid overlapping)
        const ba = bearingAndApparentElevation(lat, lon, obsElev, mt.lat, mt.lon, mt.h);
        // quick filter: only consider points roughly on sunset side (bearing between 180 and 360)
        if(ba.bearing < 150 || ba.bearing > 360) continue;

        let found = false;
        let firstMatch = null;

		for(let Y = startYear; Y < startYear + years && !found; Y++){
		  for(let doy = 0; doy < 365 && !found; doy++){
			// UTCで1月1日からdoy日目を計算
			const utcDate = new Date(Date.UTC(Y, 0, 1 + doy, 0, 0, 0));

			// 日本時間としての年月日を取得（これが大事！）
			const localY = utcDate.getUTCFullYear();
			const localM = utcDate.getUTCMonth();
			const localD = utcDate.getUTCDate();

			// 日本時間の15:00～18:30を探索
			for(let hh = 15; hh <= 18 && !found; hh++){
			  for(let mm = 0; mm < 60; mm += 5){
				// 日本時間としてDateオブジェクトを作る
				const localDate = new Date(localY, localM, localD, hh, mm, 0);
				const pos = sunAltAzLocal(lat, lon, localDate, JST);

				if(pos.alt < -2) continue;
				const azDiff = angleDiff(pos.az, ba.bearing);
				const elDiff = Math.abs(pos.alt - ba.elev);
				if(azDiff <= azTol && elDiff <= elTol){
				  found = true;
				  firstMatch = {year: localY, date: localDate, az: pos.az, alt: pos.alt};
				  break;
				}
			  }
			}
		  }
		}
        if(found){
          results.push({lat,lon,found:true,match:firstMatch,bearing:ba.bearing,elev:ba.elev});
        }
      }
    }

    // visualize: draw small circles where found
    for(const r of results){
      const c = L.circle([r.lat, r.lon], {radius: 500, color:'#ff8800', fill:true, fillOpacity:0.5}).addTo(visLayer);
	  const matchJST = r.match.date;
	  // const matchJST = new Date(r.match.date.getTime() + 9*60*60*1000);
      const dateStr = matchJST.getFullYear() + '/' +
                      String(matchJST.getMonth()+1).padStart(2,'0') + '/' +
                      String(matchJST.getDate()).padStart(2,'0') + ' ' +
                      String(matchJST.getHours()).padStart(2,'0') + ':' +
                      String(matchJST.getMinutes()).padStart(2,'0');

      c.bindPopup(`ダイヤモンド発生日時\n` +
                  `${dateStr}\n\n` +
                  `太陽方位: ${r.match.az.toFixed(2)}°　太陽高度: ${r.match.alt.toFixed(2)}°\n` +
                  `山の方位: ${r.bearing.toFixed(2)}°　山の仰角: ${r.elev.toFixed(2)}°`,
                  {maxWidth: 500});

      /* c.bindPopup(`match: ${r.match.date.toISOString().slice(0,16).replace('T',' ')}\naz=${r.match.az.toFixed(2)} alt=${r.match.alt.toFixed(2)}\nbearing=${r.bearing.toFixed(2)} elev=${r.elev.toFixed(2)}`); */
    }

    return results;
  }

  // helper: add getDOY if missing
  Date.prototype.getDOY = function(){
    const start = new Date(this.getFullYear(),0,0);
    const diff = this - start + ((start.getTimezoneOffset() - this.getTimezoneOffset())*60*1000);
    return Math.floor(diff / (1000*60*60*24));
  };

  // ===== UI hooks =====
  document.getElementById('run').addEventListener('click', async ()=>{
	  visLayer.clearLayers();
	  sampleLayer.clearLayers();

	  const startYear = Number(document.getElementById('startYear').value);
	  const years     = Number(document.getElementById('years').value);
	  const azTol     = Number(document.getElementById('azTol').value);
	  const elTol     = Number(document.getElementById('elTol').value);
	  const obsElev   = Number(document.getElementById('obsElev').value);
	  const selectedKey = document.getElementById('mountain').value;

	  if (!selectedKey || !mountains[selectedKey]) {
		  document.getElementById('info').textContent = 'エラー：中心マウンテンを選択してください！';
		  return;
	  }

	  const mt = mountains[selectedKey];

	  // ★山のマーカーを（再）描画（前回のがあったら消える）
	  if (window.mtMarker) window.mtMarker.remove();  // 前のマーカーがあったら消す
	  window.mtMarker = L.marker([mt.lat, mt.lon])
		.addTo(map)
		.bindPopup(`${mt.name}<br/>標高 ${mt.h}m`)
		.openPopup();

	  // 地図の中心をその山に移動
	  // 東に40kmずらした位置に地図の中心を移動
	  const kmEast = 40;  // ここを変えると距離も自由に変更可
	  const lonOffset = kmEast / (111.32 * Math.cos(deg2rad(mt.lat)));
	  const centerLon = mt.lon + lonOffset;

	  map.setView([mt.lat, centerLon], 10);  // ズームは10がベスト！
	  // map.setView([mt.lat, mt.lon], 10);

	  const opt = {
		  startYear, years, azTol, elTol, obsElev,
		  mountKey: selectedKey,
		  step_km: 2
	  };

	  document.getElementById('info').textContent = `計算中... (${mt.name} を中心に探索中)`;

	  try{
		const res = await computeVisibility(opt);
		document.getElementById('info').textContent = `計算完了: ${res.length} 個の候補地点を検出（${mt.name}）`;
	  } catch(e){
		console.error(e);
		document.getElementById('info').textContent = '計算中にエラーが発生しました。';
	  }
});


// ★ 山が選択された瞬間に地図の中心を「東40km」に移動）
document.getElementById('mountain').addEventListener('change', function() {
  const selectedKey = this.value;
  if (!selectedKey || !mountains[selectedKey]) {
    return; // 選択されていないときは何もしない
  }

  const mt = mountains[selectedKey];

  // 東に40kmずらす（緯度に応じて正確に計算）
  const kmEast = 40;
  const lonOffset = kmEast / (111.32 * Math.cos(deg2rad(mt.lat)));
  const centerLon = mt.lon + lonOffset;

  // スムーズに飛ぶ！（アニメーション付き）
  map.flyTo([mt.lat, centerLon], 10, {
    duration: 1.2  // 1.2秒で滑らかに移動（めっちゃかっこいい）
  });

  // マーカーも即座に更新（前のがあったら消す）
  if (window.mtMarker) window.mtMarker.remove();
  window.mtMarker = L.marker([mt.lat, mt.lon])
    .addTo(map)
    .bindPopup(`${mt.name}<br/>標高 ${mt.h}m`)
    .openPopup();
});

  map.on('click', e=>{
	const selectedKey = document.getElementById('mountain').value;
	if (!selectedKey || !mountains[selectedKey]) {
		alert('先に中心マウンテンを選択してください！');
		return;
	}
	const mt = mountains[selectedKey];
  
    const lat = e.latlng.lat, lon = e.latlng.lng;
    const obsElev = Number(document.getElementById('obsElev').value);
    const ba = bearingAndApparentElevation(lat, lon, obsElev, mt.lat, mt.lon, mt.h);

    // compute nearest match for next 5 years (coarse search)
    const startYear = Number(document.getElementById('startYear').value);
    const years = Number(document.getElementById('years').value);
    const azTol = Number(document.getElementById('azTol').value);
    const elTol = Number(document.getElementById('elTol').value);
    let found = null;
    outer: for(let Y=startYear; Y<startYear+years; Y++){
      for(let doy=0; doy<365; doy++){
        const date = new Date(Date.UTC(Y,0,1+doy,0,0,0));
		const utcDate = new Date(Date.UTC(Y, 0, 1 + doy, 0, 0, 0));
		const localY = utcDate.getUTCFullYear();
		const localM = utcDate.getUTCMonth();
		const localD = utcDate.getUTCDate();

		for(let hh = 15; hh <= 18; hh++){
		  for(let mm = 0; mm < 60; mm += 1){
			const dt = new Date(localY, localM, localD, hh, mm, 0);  // 日本時間！
			const pos = sunAltAzLocal(lat, lon, dt, JST);
            if(angleDiff(pos.az, ba.bearing) <= azTol && Math.abs(pos.alt - ba.elev) <= elTol){ found = {dt, pos}; break outer; }
          }
        }
      }
    }
    let s = `point: ${lat.toFixed(6)}, ${lon.toFixed(6)}\nbearing=${ba.bearing.toFixed(3)}°, elev=${ba.elev.toFixed(3)}°\n`;
    if(found)  {
	  const jstDate = found.dt;
	  // const jstDate = new Date(found.dt.getTime() + 9*60*60*1000);  // UTC → JST（+9時間）
	  const str = jstDate.getFullYear() + '年' +
				  String(jstDate.getMonth()+1).padStart(2,'0') + '月' +
				  String(jstDate.getDate()).padStart(2,'0') + '日 ' +
				  String(jstDate.getHours()).padStart(2,'0') + ':' +
				  String(jstDate.getMinutes()).padStart(2,'0');
	  s += `MATCH: ${str}\n az=${found.pos.az.toFixed(3)}° alt=${found.pos.alt.toFixed(3)}°`;
	}
    else s += 'No match in period';
    L.popup().setLatLng([lat,lon]).setContent(`<pre>${s}</pre>`).openOn(map);
  });

  document.getElementById('clear').addEventListener('click', ()=>{ visLayer.clearLayers(); sampleLayer.clearLayers(); document.getElementById('info').textContent='クリアしました'; });

});
</script>
</body>
</html>
