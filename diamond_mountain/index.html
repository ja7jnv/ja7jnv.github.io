<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ダイヤモンドマウンテン可視領域マップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif
        }

        #top {
            padding: 10px;
            background: #f3f3f3;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
            z-index: 1000
        }

        #controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        input,
        button,
        select {
            padding: 6px 8px;
            font-size: 14px
        }

        #map {
            flex: 1
        }

        #info {
            padding: 8px;
            max-height: 220px;
            overflow: auto;
            font-size: 13px
        }

        .legend {
            background: white;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12)
        }

        .leaflet-container {
            /* マップ上のカーソル形状 */
            /* cursor: default !important; */
            cursor: crosshair !important;
        }

        /* ポップアップを広く・自動改行・見やすく */
        .leaflet-popup-content-wrapper {
            padding: 10px 14px !important;
            border-radius: 8px !important;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3) !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            max-width: 380px !important;
            width: auto !important;
            white-space: normal !important;
            font-size: 13.5px !important;
            line-height: 1.5 !important;
        }

        .leaflet-popup-tip {
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3) !important;
        }
    </style>
</head>

<body>
    <div id="top">
        <div id="controls">
            <label>観測開始日:
                <input type="date" id="startDate">
            </label>
            <label>探索期間:
                <select id="years">
                    <option value="1" selected>1年</option>
                    <option value="2">2年</option>
                    <option value="3">3年</option>
                    <option value="5">5年</option>
                </select>
            </label>
            <label>中心マウンテン:
                <select id="mountain">
                    <option value="" disabled selected>－－ 山を選択 －－</option>
                    <option value="fuji">富士山（剣ヶ峰）</option>
                    <option value="chokai">鳥海山（七高山）</option>
                    <!-- 山を追加する場合は、ここに追加する -->
                </select>
            </label>
            <label>観測地表からの高度(m): <input id="obsElev" type="number" value="0" style="width:80px"></label>
            <label>方位許容(°): <input id="azTol" type="number" value="0.5" step="0.1" style="width:70px"></label>
            <label>仰角許容(°): <input id="elTol" type="number" value="0.5" step="0.1" style="width:70px"></label>
            <button id="run">可視領域計算</button>
            <button id="clear">クリア</button>
        </div>
        <div id="info">座標をクリックするとその地点の可視判定・山方向・山頂仰角を表示します。</div>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS (placed before our script). No integrity attribute to avoid CDN integrity mismatch issues -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Ensure code runs after Leaflet has loaded and DOM is ready
        window.addEventListener('load', function() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('startDate').value = `${yyyy}-${mm}-${dd}`;

            let assumedElevation = 50; // デフォルト仮定標高（m）

            if (typeof L === 'undefined') {
                document.getElementById('info').textContent = 'エラー: Leaflet が読み込まれていません。ネットワーク接続を確認するか、script タグを修正してください。';
                return;
            }

            // ===== Configuration =====
            const JST = 9; // 日本時間UTC差
            const mountains = {
                chokai: {
                    name: '鳥海山 (七高山)',
                    lat: 39.09945869580092,
                    lon: 140.0513154997461,
                    h: 2230
                },
                fuji: {
                    name: '富士山 (剣ヶ峰)',
                    lat: 35.3607237631673,
                    lon: 138.72738839451753,
                    h: 3776
                }
            };
            const map_center = { // 高尾山大見晴台
                lat: 35.62,
                lon: 139.24
            };
            const map_width = 10;

            // ===== Leaflet map setup =====
            const map = L.map('map').setView(map_center, map_width);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            let visLayer = L.layerGroup().addTo(map);
            let sampleLayer = L.layerGroup().addTo(map);

            // ===== Astronomy helpers (JS translation of earlier functions) =====
            const deg2rad = d => d * Math.PI / 180;
            const rad2deg = r => r * 180 / Math.PI;

            function toJulianDayUTC(dateUtc) {
                // dateUtc is JS Date in UTC
                const Y = dateUtc.getUTCFullYear();
                let M = dateUtc.getUTCMonth() + 1;
                let D = dateUtc.getUTCDate() + (dateUtc.getUTCHours() + dateUtc.getUTCMinutes() / 60 + dateUtc.getUTCSeconds() / 3600 + dateUtc.getUTCMilliseconds() / 3.6e6) / 24;
                let Y2 = Y;
                let M2 = M;
                if (M2 <= 2) {
                    Y2 -= 1;
                    M2 += 12
                }
                const A = Math.floor(Y2 / 100);
                const B = 2 - A + Math.floor(A / 4);
                const JD = Math.floor(365.25 * (Y2 + 4716)) + Math.floor(30.6001 * (M2 + 1)) + D + B - 1524.5;
                return JD;
            }

            function sunPositionJD(jd) {
                const n = jd - 2451545.0;
                let L = (280.460 + 0.9856474 * n) % 360;
                if (L < 0) L += 360;
                const g = (357.528 + 0.9856003 * n) % 360;
                const gRad = deg2rad(g);
                let lam = L + 1.915 * Math.sin(gRad) + 0.02 * Math.sin(2 * gRad);
                lam = (lam % 360 + 360) % 360;
                const eps = deg2rad(23.439);
                const lamRad = deg2rad(lam);
                const delta = Math.asin(Math.sin(eps) * Math.sin(lamRad));
                return {
                    lambda: lam,
                    decl: rad2deg(delta)
                };
            }

            function hourAngleFromLocalClock(localDate, longitude, tzOffsetHours) {
                // localDate: JS Date representing local clock time (naive) - we will use its components
                const Hh = localDate.getHours() + localDate.getMinutes() / 60 + localDate.getSeconds() / 3600;
                const localSolarTime = Hh + (longitude / 15.0) - tzOffsetHours;
                return 15 * (localSolarTime - 12); // degrees
            }

            function sunAltAzLocal(lat, lon, localDate, tzOffsetHours) {
                // compute UTC date equivalent
                const utcMillis = Date.UTC(localDate.getFullYear(), localDate.getMonth(), localDate.getDate(), localDate.getHours() - tzOffsetHours, localDate.getMinutes(), localDate.getSeconds(), localDate.getMilliseconds());
                const dtUtc = new Date(utcMillis);
                const jd = toJulianDayUTC(dtUtc);
                const sp = sunPositionJD(jd);
                const delta = deg2rad(sp.decl);
                const phi = deg2rad(lat);
                const Hdeg = hourAngleFromLocalClock(localDate, lon, tzOffsetHours);
                const H = deg2rad(Hdeg);
                let sin_h = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(H);
                sin_h = Math.max(-1, Math.min(1, sin_h));
                const alt = rad2deg(Math.asin(sin_h));
                const y = -Math.sin(H);
                const x = Math.cos(phi) * Math.tan(delta) - Math.sin(phi) * Math.cos(H);
                let az = rad2deg(Math.atan2(y, x));
                az = (az + 360) % 360;
                return {
                    alt,
                    az
                };
            }

            function bearingAndApparentElevation(latObs, lonObs, hObs, latTgt, lonTgt, hTgt) {
                const R = 6371000;
                const lat1 = deg2rad(latObs),
                    lat2 = deg2rad(latTgt);
                const dlon = deg2rad(lonTgt - lonObs);
                const y = Math.sin(dlon) * Math.cos(lat2);
                const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dlon);
                const bearing = (rad2deg(Math.atan2(y, x)) + 360) % 360;
                const central = Math.acos(Math.max(-1, Math.min(1, Math.sin(lat1) * Math.sin(lat2) + Math.cos(lat1) * Math.cos(lat2) * Math.cos(dlon))));
                const dist = R * central;
                const dh = hTgt - hObs;
                const elev = rad2deg(Math.atan2(dh, dist));
                return {
                    bearing,
                    elev,
                    dist
                };
            }

            function angleDiff(a, b) {
                const d = Math.abs(a - b) % 360;
                return Math.min(d, 360 - d);
            }

            //  山から東に40kmずらした座標を返す関数
            function getViewCenterFromMountain(mt, kmEast = 40) {
                const deg2rad = d => d * Math.PI / 180;
                const lonOffset = kmEast / (111.32 * Math.cos(deg2rad(mt.lat)));
                const centerLon = mt.lon + lonOffset;
                return {
                    lat: mt.lat,
                    lon: centerLon,
                    zoom: 10
                };
            }

            // ===== Visibility grid calculation =====
            // We'll scan a bounding box around mountain (radius R_km) and sample points on a grid.
            // For each grid point: compute bearing & apparent elev to mountain.
            // Then check if there exists a time in the search period where sun.az ~= bearing and sun.alt ~= elev

            async function computeVisibility(opts) {
                visLayer.clearLayers();
                sampleLayer.clearLayers();

                const startDate = opts.startDate; // ← Dateオブジェクト
                const years = parseInt(opts.years, 10);
                const azTol = parseFloat(opts.azTol);
                const elTol = parseFloat(opts.elTol);
                const obsElev = parseFloat(opts.obsElev);
                const mt = mountains[opts.mountKey];

                const Rkm = 60;
                const step_km = opts.step_km || 2;

                const lat_km = 111.32;
                const lon_km_at_lat = 111.32 * Math.cos(deg2rad(mt.lat));
                const dlat = Rkm / lat_km;
                const dlon = Rkm / lon_km_at_lat;

                const lat_min = mt.lat - dlat;
                const lat_max = mt.lat + dlat;
                const lon_min = mt.lon - dlon;
                const lon_max = mt.lon + dlon;

                const lat_step = step_km / lat_km;
                const lon_step = step_km / lon_km_at_lat;

                const results = [];
                let currentDate = new Date(startDate);

                // グリッド走査
                for (let lat = lat_min; lat <= lat_max + 1e-12; lat += lat_step) {
                    for (let lon = lon_min; lon <= lon_max + 1e-12; lon += lon_step) {
                        const ba = bearingAndApparentElevation(lat, lon, obsElev, mt.lat, mt.lon, mt.h);
                        if (ba.bearing < 150 || ba.bearing > 360) continue;

                        let found = false;
                        let firstMatch = null;

                        // ここから日付ループ（クリック時と同じロジック）
                        const endDate = new Date(startDate);
                        endDate.setFullYear(endDate.getFullYear() + years);

                        while (currentDate < endDate && !found) {
                            const Y = currentDate.getFullYear();
                            const M = currentDate.getMonth();
                            const D = currentDate.getDate();

                            for (let hh = 15; hh <= 18 && !found; hh++) {
                                for (let mm = 0; mm < 60; mm += 5) {
                                    const dt = new Date(Y, M, D, hh, mm, 0);
                                    const pos = sunAltAzLocal(lat, lon, dt, JST);

                                    if (pos.alt < -2) continue;
                                    const azDiff = angleDiff(pos.az, ba.bearing);
                                    const elDiff = Math.abs(pos.alt - ba.elev);
                                    if (azDiff <= azTol && elDiff <= elTol) {
                                        found = true;
                                        firstMatch = {
                                            date: dt,
                                            az: pos.az,
                                            alt: pos.alt
                                        };
                                        break;
                                    }
                                }
                            }
                            currentDate.setDate(currentDate.getDate() + 1);
                        }

                        if (found) {
                            results.push({
                                lat,
                                lon,
                                found: true,
                                match: firstMatch,
                                bearing: ba.bearing,
                                elev: ba.elev
                            });
                        }

                        // currentDateをリセット（次のグリッド点用）
                        currentDate = new Date(startDate);
                    }
                }

                // 結果描画（変更なし）
                for (const r of results) {
                    const c = L.circle([r.lat, r.lon], {
                        radius: 500,
                        color: '#ff8800',
                        fill: true,
                        fillOpacity: 0.5
                    }).addTo(visLayer);

                    const d = r.match.date;
                    const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ` +
                        `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

                    c.bindPopup(`初回ダイヤモンド発生\n${dateStr}\n\n` +
                        `太陽方位: ${r.match.az.toFixed(2)}°　高度: ${r.match.alt.toFixed(2)}°\n` +
                        `山の方位: ${r.bearing.toFixed(2)}°　仰角: ${r.elev.toFixed(2)}°`, {
                            maxWidth: 500
                        });
                }

                return results;
            }

            // helper: add getDOY if missing
            Date.prototype.getDOY = function() {
                const start = new Date(this.getFullYear(), 0, 0);
                const diff = this - start + ((start.getTimezoneOffset() - this.getTimezoneOffset()) * 60 * 1000);
                return Math.floor(diff / (1000 * 60 * 60 * 24));
            };

            // ===== UI hooks =====
            document.getElementById('run').addEventListener('click', async () => {
                visLayer.clearLayers();
                sampleLayer.clearLayers();

                const startDateStr = document.getElementById('startDate').value;
                if (!startDateStr) {
                    document.getElementById('info').textContent = 'エラー：観測開始日を選択してください！';
                    return;
                }
                const startDate = new Date(startDateStr);
                const years = Number(document.getElementById('years').value);

                const azTol = Number(document.getElementById('azTol').value);
                const elTol = Number(document.getElementById('elTol').value);
                const groundInput = Number(document.getElementById('obsElev').value) || 0;
                const selectedKey = document.getElementById('mountain').value;

                if (!selectedKey || !mountains[selectedKey]) {
                    document.getElementById('info').textContent = 'エラー：中心マウンテンを選択してください！';
                    return;
                }

                const mt = mountains[selectedKey];

                // 山マーカーと地図移動
                if (window.mtMarker) window.mtMarker.remove();
                window.mtMarker = L.marker([mt.lat, mt.lon])
                    .addTo(map)
                    .bindPopup(`${mt.name}<br/>標高 ${mt.h}m`)
                    .openPopup();

                const view = getViewCenterFromMountain(mt, 40);
                map.setView([view.lat, view.lon], view.zoom);

                // 総観測高度（クリック時の地形標高を再利用）
                const totalObsElev = groundInput + lastTerrainElevation;

                // ★ optにstartDateを渡す（computeVisibility内で使う）
                const opt = {
                    startDate: startDate,
                    years: years,
                    azTol: azTol,
                    elTol: elTol,
                    obsElev: totalObsElev,
                    mountKey: selectedKey,
                    step_km: 2
                };

                document.getElementById('info').textContent =
                    `計算中... ${mt.name} の可視領域（${years}年間、総観測高度 ${totalObsElev.toFixed(1)}m）`;

                try {
                    const res = await computeVisibility(opt);
                    document.getElementById('info').textContent =
                        `計算完了: ${res.length} 個の候補地点を検出（${mt.name}）`;
                } catch (e) {
                    console.error(e);
                    document.getElementById('info').textContent = '計算中にエラーが発生しました。';
                }
            });

            // ★ 山が選択された瞬間に地図の中心を「東40km」に移動）
            document.getElementById('mountain').addEventListener('change', function() {
                const selectedKey = this.value;
                if (!selectedKey || !mountains[selectedKey]) {
                    return; // 選択されていないときは何もしない
                }

                const mt = mountains[selectedKey];
                const view = getViewCenterFromMountain(mt, 40); // 40km東を地図の中心に
                map.flyTo([view.lat, view.lon], view.zoom, {
                    duration: 1.2
                });

                // マーカーも即座に更新（前のがあったら消す）
                if (window.mtMarker) window.mtMarker.remove();
                window.mtMarker = L.marker([mt.lat, mt.lon])
                    .addTo(map)
                    .bindPopup(`${mt.name}<br/>標高 ${mt.h}m`)
                    .openPopup();
            });

            // ★ 国土地理院APIで標高取得（失敗時は50m + データソースも取得）
            async function getElevation(lat, lon) {
                try {
                    const res = await fetch(
                        `https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lon}&lat=${lat}&outtype=JSON`
                    );
                    if (!res.ok) throw new Error("ネットワークエラー");
                    const data = await res.json();
                    if (data.elevation === "-----") throw new Error("標高データなし");
                    return {
                        elevation: parseFloat(data.elevation),
                        source: data.hsrc || "不明"
                    };
                } catch (err) {
                    console.warn("標高取得失敗 → 50mで代替", err);
                    return {
                        elevation: 50,
                        source: "仮定値（取得失敗）"
                    };
                }
            }

            // ★ グローバル：最後に取得した地形標高（runボタンでも使う）
            let lastTerrainElevation = 50; // 初期値

            map.on('click', async e => {
                const selectedKey = document.getElementById('mountain').value;
                if (!selectedKey || !mountains[selectedKey]) {
                    alert('先に中心マウンテンを選択してください！');
                    return;
                }

                const startDateStr = document.getElementById('startDate').value;
                const startDate = new Date(startDateStr);
                const years = Number(document.getElementById('years').value);
                const azTol = Number(document.getElementById('azTol').value);
                const elTol = Number(document.getElementById('elTol').value);

                const mt = mountains[selectedKey];

                const lat = e.latlng.lat.toFixed(6);
                const lon = e.latlng.lng.toFixed(6);

                // ユーザーが入力した「地表からの追加高度」
                const groundInput = Number(document.getElementById('obsElev').value) || 0;

                // ★ 標高取得中表示
                document.getElementById('info').textContent = '標高取得中…（1〜3秒）';

                // ★ ここでAPI呼び出し
                const elevData = await getElevation(e.latlng.lat, e.latlng.lng);
                const terrainElev = elevData.elevation; // 地形標高
                lastTerrainElevation = terrainElev; // runボタンでも使うので保存
                const totalObsElev = groundInput + terrainElev; // 総観測高度

                // ★ 山に対する方位・仰角を「総観測高度」で計算
                const ba = bearingAndApparentElevation(
                    e.latlng.lat, e.latlng.lng, totalObsElev,
                    mt.lat, mt.lon, mt.h
                );

                let firstMatch = null;
                let lastMatch = null;
                let bestMatch = null;
                let bestError = Infinity;
                let currentDate = new Date(startDateStr);

                outer:
                    for (let y = 0; y < years * 2; y++) { // 安全マージン
                        for (let d = 0; d < 366; d++) {
                            if (currentDate.getFullYear() > startDate.getFullYear() + years) break outer;

                            const Y = currentDate.getFullYear();
                            const M = currentDate.getMonth();
                            const D = currentDate.getDate();

                            let dayHasMatch = false;

                            for (let hh = 15; hh <= 18; hh++) {
                                for (let mm = 0; mm < 60; mm += 1) {
                                    const dt = new Date(Y, M, D, hh, mm, 0);
                                    const pos = sunAltAzLocal(e.latlng.lat, e.latlng.lng, dt, JST);

                                    const azDiff = angleDiff(pos.az, ba.bearing);
                                    const elDiff = Math.abs(pos.alt - ba.elev);

                                    if (azDiff <= azTol && elDiff <= elTol) {
                                        dayHasMatch = true;
                                        const totalError = azDiff + elDiff;

                                        if (!firstMatch) firstMatch = {
                                            dt,
                                            pos
                                        };
                                        lastMatch = {
                                            dt,
                                            pos
                                        };
                                        if (totalError < bestError) {
                                            bestError = totalError;
                                            bestMatch = {
                                                dt,
                                                pos
                                            };
                                        }
                                    }
                                }
                            }

                            if (firstMatch && !dayHasMatch) break outer; // 連続終了！

                            currentDate.setDate(currentDate.getDate() + 1);
                        }
                    }

                // ★ ポップアップ内容
                let s = `座標: ${lat}, ${lon}\n`;
                s += `地形標高: ${terrainElev.toFixed(1)}m（${elevData.source}）\n`;
                s += `＋地表からの高さ: ${groundInput}m\n`;
                s += `＝総観測高度: ${totalObsElev.toFixed(1)}m\n`;
                s += `山の方位: ${ba.bearing.toFixed(3)}°　仰角: ${ba.elev.toFixed(3)}°\n`;

                if (firstMatch) {
                    const formatDate = (obj) => {
                        const d = obj.dt;
                        return `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,'0')}月${String(d.getDate()).padStart(2,'0')}日 ` +
                            `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    };

                    const days = Math.round((lastMatch.dt - firstMatch.dt) / (1000 * 60 * 60 * 24)) + 1;

                    s += `【直近のダイヤモンド発生可能期間】（今日から最初に見える日）\n`;
                    s += `BEGIN: ${formatDate(firstMatch)}\n`;
                    s += `END:   ${formatDate(lastMatch)}\n`;
                    s += `期間: ${days}日間（連続）\n\n`;

                    s += `ベストマッチ（この期間内）\n`;
                    s += `MATCH: ${formatDate(bestMatch)}\n`;
                    s += `　太陽方位 ${bestMatch.pos.az.toFixed(2)}°　高度 ${bestMatch.pos.alt.toFixed(2)}°`;
                } else {
                    s += '指定期間内で条件を満たす日はありません';
                }

                document.getElementById('info').textContent = `総観測高度 ${totalObsElev.toFixed(1)}m で計算`;

                L.popup()
                    .setLatLng(e.latlng)
                    .setContent(`<pre style="font-size:13px;line-height:1.4">${s}</pre>`)
                    .openOn(map);
            });

            document.getElementById('clear').addEventListener('click', () => {
                visLayer.clearLayers();
                sampleLayer.clearLayers();
                document.getElementById('info').textContent = 'クリアしました';
            });

        });
    </script>
</body>

</html>
